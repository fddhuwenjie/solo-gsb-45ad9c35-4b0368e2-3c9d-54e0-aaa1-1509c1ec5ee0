services:
  api:
    build: .
    image: blind-review-api:latest
    container_name: blind-review-api
    ports:
      - "8000:8000"
    volumes:
      - blind_review_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  blind_review_data:
